# FMAPI 비용 계산 단가 (plan §10). 비용의 단일 소스.
# USD = usd_per_dbu × (billable_input×dbu_in + billable_output×dbu_out + cache…) / 1e6
# billable_output = completion_tokens + reasoning_tokens  ← reasoning 토큰 포함 필수!
#
# === 단가 확정 상태 (2026-07-31 검증) ===
# DBU 단가: Databricks 공식 pricing 페이지에서 확정.
#   - GLM-5.2 (20.0/62.857): foundation-model-serving 페이지에서 재확인 ✅
#   - opus-5/sol/gemini: proprietary-foundation-model-serving 페이지 + 제공자 list price
#     2개 소스 교차검증 ✅ ($0.07/DBU 적용 시 제공자 list price와 정확히 일치)
# usd_per_dbu = 0.07: Databricks Premium Model Serving 표준 단가로 확정 채택.
#   - system.billing.list_prices로 계약별 실단가 대조를 시도했으나 워크스페이스 권한 없음
#     (USE SCHEMA 거부). ai_gateway.usage에도 비용 컬럼 없음(토큰만). → 공개 표준단가 채택.
#   - 계약 단가가 다르면 이 한 줄만 바꾸면 전체 비용이 재계산됨.
# 남은 변수: 라우팅(global 기본, in-geo는 ~10%↑), gemini 20% 프로모(~2027-01-31 적용중).

usd_per_dbu: 0.07                        # 확정: Premium Model Serving 표준단가 (계약단가 있으면 교체)
routing: global                          # global | in-geo (~10% 높음)

models:
  databricks-claude-opus-5:
    dbu_in: 71.429
    dbu_out: 357.143
    dbu_cache_write: 89.286
    dbu_cache_read: 7.143

  databricks-gpt-5-6-sol:
    context_threshold_tokens: 200000     # CONFIRM: short/long 경계
    short: {dbu_in: 71.429, dbu_out: 428.571, dbu_cache_write: 89.286, dbu_cache_read: 7.143}
    long: {dbu_in: 142.857, dbu_out: 642.857, dbu_cache_write: 178.571, dbu_cache_read: 14.286}

  databricks-claude-sonnet-5:
    # 2026-08-06 확인(proprietary-foundation-model-serving, Global/All Lengths).
    # ⚠️ Anthropic 도입기 프로모 단가로, **2026-08-31까지** 유효하다고 명시돼 있다.
    # 그 이후 재실행 시 이 값을 다시 확인할 것(비용 비교가 틀어진다).
    dbu_in: 28.571
    dbu_out: 142.857
    dbu_cache_write: 35.714
    dbu_cache_read: 2.857

  databricks-glm-5-2:
    dbu_in: 20.000
    dbu_out: 62.857

  # databricks-kimi-k3: 단가 미등록 — **아직 확정 전이라 못 넣는다**(2026-08-08 내부 자료 확인).
  #   근거(1차 소스): Kimi K3 런칭 티켓 DOC-27032은 "Pricing table intentionally left unchanged
  #   until input and output DBU rates are finalized", "Input/output DBU pricing rates (pending)"라고
  #   두 번 명시. 후속 티켓 DOC-27230도 단가를 아직 '필요' 항목으로 둠. Microsoft Learn DBU 표
  #   (2026-08-05 갱신)·foundation-model-serving 페이지 어디에도 kimi-k3 행이 없다(신규 오픈모델은
  #   Money API intake 지연으로 등재가 늦음 — Slack CPS3MLXUJ 스레드). 티켓의 "copy GLM 5.2"는
  #   **product availability**(PT·AI Functions 등) 얘기지 DBU 단가가 아니다 — GLM 값(20/62.857)을
  #   베끼면 근거 없는 수치가 된다. 그래서 비워 둔다(validator 경고=치명 아님, 리포트는 '단가 미등록'
  #   표기 + **비용 비교에서만** 제외, 성능 비교는 정상).
  #   → 확정되면(위 티켓/pricing 페이지에 kimi-k3 행이 뜨면) dbu_in/dbu_out을 여기 추가하면 비용도 채워진다.

  databricks-gemini-3-1-pro:
    context_threshold_tokens: 200000
    promo_multiplier: 0.80               # 20% 할인 (~2027-01-31), 적용 여부 결정
    short: {dbu_in: 35.714, dbu_out: 214.286, dbu_cache_write: 35.714, dbu_cache_read: 3.571}
    long: {dbu_in: 71.429, dbu_out: 321.429, dbu_cache_write: 71.429, dbu_cache_read: 7.143}
