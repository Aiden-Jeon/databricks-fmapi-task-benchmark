# Judge rubrics (plan §7-0). Judge=databricks-gemini-3-1-pro; response content is a LIST → parse text part.
# Tasks with judge metric: IMG-1 (caption), TXT-1 (doc QA), TXT-2 (table QA), TXT-5 (summarization).
# For Korean tasks (TXT-5 has ko): judge must assess Korean morphology/particles correctly.

IMG-1:
  task: "이미지 캡션 정확도"
  language: "en"
  scale:
    1: "캡션이 이미지와 맞지 않거나 핵심 요소들을 놓침"
    2: "캡션이 기본 요소는 포착하나 부정확한 세부사항이나 누락된 뉘앙스 있음"
    3: "캡션이 이미지의 주요 요소를 정확하게 설명하나 일부 세부사항 미흡"
    4: "캡션이 정확하고 유창하며 대부분의 세부사항과 뉘앙스 포착"
    5: "캡션이 정확·유창하고 핵심 요소·세부사항·시각적 뉘앙스까지 완벽하게 포착"

TXT-1:
  task: "문서(PDF) 이해 QA - 정답 생성 정확도"
  language: "en"
  scale:
    1: "답변이 문서 내용과 무관하거나 크게 부정확함"
    2: "답변이 문서의 일부만 반영하거나 핵심이 왜곡됨"
    3: "답변이 문서 내용의 대부분을 정확하게 반영하나 미세한 오류나 누락 있음"
    4: "답변이 정답과 거의 동일하고 미세한 표현 차이만 있음"
    5: "답변이 정답과 동일하거나 동등 수준의 정확성·완전성으로 정보 전달"

TXT-2:
  task: "표(엑셀) 이해 QA - 테이블 셀값 추출 정확도"
  language: "en"
  scale:
    1: "추출한 값이 표와 맞지 않거나 완전히 잘못됨"
    2: "추출한 값이 부분적으로만 맞고 주요 값에 오류 있음"
    3: "추출한 값이 대부분 맞으나 일부 셀에 오류 또는 형식 미흡"
    4: "추출한 값이 거의 정확하고 미세한 형식 차이만 있음"
    5: "추출한 값이 정확하고 정답 셀값과 완벽하게 일치"

TXT-5:
  task: "텍스트 요약(다국어) - 요약 품질 및 완전성"
  language: "en+ko"
  scale:
    1: "요약이 원문과 무관하거나 핵심을 심각하게 왜곡함. 한국어: 문법 오류, 형태소 미분리"
    2: "요약이 원문의 일부만 포착하거나 요약이 불완전함. 한국어: 어색한 표현이나 부정확한 조사 사용"
    3: "요약이 원문의 주요 내용을 전달하나 일부 정보 손실 또는 세부사항 누락. 한국어: 기본 문법은 맞으나 고급 표현 미흡"
    4: "요약이 원문의 핵심을 정확하고 효율적으로 전달하며 미세한 생략만 있음. 한국어: 올바른 형태소 분석과 자연스러운 표현"
    5: "요약이 정확하고 유창하며 원문의 모든 핵심 정보를 효율적으로 전달. 한국어: 형태소 정확성, 조사·어미 올바름, 자연스러운 한국어"
