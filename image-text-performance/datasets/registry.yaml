  license: "mirror CC-BY-4.0 / original CC-BY-4.0"
  commercial_ok: unknown
  languages: [en]
  split: "test"
  mirror_of: "Original stanfordnlp/wikitablequestions script-based; parquet mirror enabled."
  note: >-
    이 미러는 split이 뒤집혀 있다 — train은 10행뿐이고 실데이터 18486행이 test에 있다
    (load_dataset_builder().info.splits 실측: train 10 / test 18486). 이전에는 split이
    "default"(=config 이름이지 split이 아님)로 적혀 있고 txt_2.py가 그걸 train으로 치환해,
    30샘플을 요청해도 항상 10샘플만 채점됐다(2026-08-05 수정). 유효 split은 train/test뿐.

