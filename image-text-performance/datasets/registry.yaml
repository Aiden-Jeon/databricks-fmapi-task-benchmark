doc_vqa:
  hf_id: "nielsr/docvqa_1200_examples"
  license: "unspecified on mirror / original DocVQA research-use"
  commercial_ok: false
  languages: [en]
  split: "test"
  question_column: "query.en"   # query는 dict(de/en/es/fr/it) → en만 사용
  ocr_column: "words"           # OCR 토큰 list → 문서 컨텍스트로 결합(TXT-1은 텍스트 태스크)
  revision: "dc77ab0c3d98855d0f3cb3a00832f2423fbe7528"   # 기록용(로더 미사용 — 이슈 J)
  mirror_of: >-
    DocVQA(Biten et al., ICCV 2019) 1200건 서브셋. 이전에 쓴 HuggingFaceM4/DocumentVQA는
    OCR 텍스트 컬럼이 없어(features: questionId/question/question_types/image/docId/ucsf_*/answers)
    TXT-1이 문서 없이 질문만 보내는 무문맥 QA가 되고 있었다(2026-08-05 실측: 30/30행 컨텍스트 없음).
    full-size 미러(lmms-lab/DocVQA 등)도 페이지 이미지만 제공하고 OCR은 없어, OCR(words)을
    가진 이 서브셋으로 교체했다. 원본 라이선스는 research-use.
  note: "splits: train 1000 / test 200. 평가는 test 사용. words는 페이지 OCR 토큰이라 원문 레이아웃은 소실됨."
  expected_sha256: null

