# Dataset registry (plan §5). 표준·불변 데이터셋을 hf_id + config + split + **revision**
# (HF 커밋 SHA)으로 고정한다. revision을 로더(load_hf_split)가 실제로 사용하므로,
# HF main이 갱신돼도 같은 seed·같은 코드면 같은 데이터가 온다.
# (옛 expected_sha256 필드는 전부 null이고 코드에서 쓰지 않아 제거했다 — revision이 그 역할.)
# NSFW media = cache-only, never commit (D3).
# Mirror datasets (script-based originals disabled): license may differ from original → both recorded.

